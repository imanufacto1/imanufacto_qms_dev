name: Multi-Environment Pipeline

on:
  push:
    branches: [ "dev", "qa", "prod" ]
  pull_request:
    branches: [ "dev", "qa", "prod" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # 1. Continuous Integration (CI) - Runs on ALL PRs and Pushes
  # ------------------------------------------------------------------
  ci-check:
    name: CI Check (Lint, Type, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ------------------------------------------------------------------
  # 2. Deploy to Development (Dev) - Runs only on PUSH to 'dev'
  # ------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: ci-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.imanufacto.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Dev Environment
        run: |
          echo "🚀 Deploying to Development Environment..."
          # Add your actual deployment commands here (e.g., Vercel, AWS, Docker)
          echo "✅ Deployment to Dev Complete"

  # ------------------------------------------------------------------
  # 3. Promote Dev to QA (Create PR) - Runs after successful Dev Deploy
  # ------------------------------------------------------------------
  promote-to-qa:
    name: Create PR (Dev -> QA)
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing PRs from dev to qa..."
          EXISTING_PR=$(gh pr list --base qa --head dev --json url --jq '.[0].url')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Creating PR from dev to qa..."
            gh pr create \
              --base qa \
              --head dev \
              --title "🚀 Promote Dev to QA" \
              --body "Automated PR to promote changes from Development to QA environment. Triggered by successful deployment to Dev."
          else
            echo "PR already exists: $EXISTING_PR"
          fi

  # ------------------------------------------------------------------
  # 4. Deploy to QA - Runs only on PUSH to 'qa' (merged from dev)
  # ------------------------------------------------------------------
  deploy-qa:
    name: Deploy to QA
    needs: ci-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://qa.imanufacto.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to QA Environment
        run: |
          echo "🚀 Deploying to QA Environment..."
          # Add your actual deployment commands here
          echo "✅ Deployment to QA Complete"

  # ------------------------------------------------------------------
  # 5. Promote QA to Prod (Create PR) - Runs after successful QA Deploy
  # ------------------------------------------------------------------
  promote-to-prod:
    name: Create PR (QA -> Prod)
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing PRs from qa to prod..."
          EXISTING_PR=$(gh pr list --base prod --head qa --json url --jq '.[0].url')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Creating PR from qa to prod..."
            gh pr create \
              --base prod \
              --head qa \
              --title "🚀 Promote QA to Production" \
              --body "Automated PR to promote changes from QA to Production environment. Triggered by successful deployment to QA."
          else
            echo "PR already exists: $EXISTING_PR"
          fi

  # ------------------------------------------------------------------
  # 6. Deploy to Production (Prod) - Runs only on PUSH to 'prod' (merged from qa)
  # ------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: ci-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imanufacto.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Production Environment
        run: |
          echo "🚀 Deploying to Production Environment..."
          # Add your actual deployment commands here
          echo "✅ Deployment to Production Complete"
